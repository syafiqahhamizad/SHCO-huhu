name: Firebase Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER || secrets.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT || secrets.WIF_SERVICE_ACCOUNT }}

      - name: Install function dependencies
        run: |
          npm ci --prefix functions
          npm ci --prefix functions-user

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy production site to Firebase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: firebase deploy --project gen-lang-client-0565207218 --force

      - name: Deploy preview channel for PR
        if: github.event_name == 'pull_request'
        id: preview_deploy
        run: |
          DEPLOY_OUTPUT=$(firebase hosting:channel:deploy pr-${{ github.event.pull_request.number }} --project gen-lang-client-0565207218 --expires 7d 2>&1 | tee /tmp/preview.log)
          echo "$DEPLOY_OUTPUT"
          URL=$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[^ ]+\.web.app' | tail -n 1)
          if [ -n "$URL" ]; then
            echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          fi

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && env.PREVIEW_URL != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.pull_request.number;
            const url = process.env.PREVIEW_URL;
            const body = `Preview URL: ${url}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
